[build]
  # Deploy previews/branch deploys build off a branch whose Tina schema hasn't been
  # indexed by Tina Cloud yet (that only happens once the branch lands on `main`) —
  # `tinacms build` hard-fails on that drift even for non-breaking field additions.
  # Only the production build (main) needs the live cloud-schema check.
  command = "if [ \"$CONTEXT\" = \"production\" ]; then npm run build; else npm run build -- --skip-cloud-checks; fi"
  publish = "dist"

[build.environment]
  NODE_OPTIONS = "--max-old-space-size=4096"

[images]
  remote_images = ["https://assets\\.tina\\.io/.*"]
